# nginx config for the secret URL. run.sh fills in the @...@ values and
# writes the result to a folder only the languagetool user can read.
daemon off;
worker_processes 1;
pid @CONF_DIR@/nginx.pid;
# Only critical errors: other error lines would show the secret key.
error_log stderr crit;

events {
  worker_connections 256;
}

http {
  access_log off;
  server_tokens off;
  client_body_temp_path @CONF_DIR@/body;
  proxy_temp_path @CONF_DIR@/proxy;
  fastcgi_temp_path @CONF_DIR@/fastcgi;
  uwsgi_temp_path @CONF_DIR@/uwsgi;
  scgi_temp_path @CONF_DIR@/scgi;
  # Room for long texts. LanguageTool sets its own text length limit.
  client_max_body_size 20m;

  server {
    listen @APP_PORT@ default_server;

    # Requests with the key go to LanguageTool, without the key in the path.
    location ^~ /@SECRET_KEY@/ {
      proxy_pass http://127.0.0.1:@INTERNAL_PORT@/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # The key alone, without a path after it, gets no answer either.
    location = /@SECRET_KEY@ {
      return 444;
    }

    # Everything else: close the connection without sending an answer.
    location / {
      return 444;
    }
  }
}
